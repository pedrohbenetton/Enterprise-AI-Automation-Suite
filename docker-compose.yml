# Enterprise AI Automation Suite — stack local
# Uso:  cp .env.example .env  &&  docker compose up -d
#
# Topologia (n8n em "queue mode"):
#   n8n (main)   -> UI, API REST e recepção de webhooks; enfileira execuções no Redis
#   n8n-worker   -> consome a fila (BullMQ) e executa os workflows (escala horizontal)
#   postgres     -> banco interno do n8n  +  banco de negócio "automation" (faturas, leads, DLQ)
#   redis        -> fila do n8n (db 0)  +  idempotência/cache dos workflows (db 1)

name: enterprise-ai-automation

x-n8n-common: &n8n-common
  image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.45.7}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment:
    # --- Banco interno do n8n ---
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
    DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n_admin}
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}

    # --- Queue mode (Redis/BullMQ) ---
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    QUEUE_BULL_REDIS_DB: 0
    QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    # Binários (PDF/imagens do Fluxo B) precisam ser visíveis para main e workers
    N8N_DEFAULT_BINARY_DATA_MODE: database
    N8N_PAYLOAD_SIZE_MAX: ${N8N_PAYLOAD_SIZE_MAX:-32}

    # --- Segurança / runtime ---
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
    N8N_RUNNERS_ENABLED: "true"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    # Workflows leem apenas configuração NÃO sensível via $env (canais, modelos, limiares).
    # Segredos (API keys) ficam em Credentials do n8n, criptografadas com N8N_ENCRYPTION_KEY.
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    NODE_FUNCTION_ALLOW_BUILTIN: crypto

    # --- URLs / timezone ---
    N8N_HOST: ${N8N_HOST:-localhost}
    N8N_PORT: 5678
    N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
    WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
    GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
    TZ: ${TZ:-America/Sao_Paulo}

    # --- Retenção de execuções ---
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}

    # --- Configuração de negócio consumida pelos workflows ($env.*) ---
    APP_DB_NAME: ${APP_DB_NAME:-automation}
    LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-claude-sonnet-5-5}
    LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-claude-haiku-5-5}
    LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-30000}
    TRIAGE_URGENCY_THRESHOLD: ${TRIAGE_URGENCY_THRESHOLD:-0.75}
    SLACK_CHANNEL_CRITICAL: ${SLACK_CHANNEL_CRITICAL:-#leads-criticos}
    SLACK_CHANNEL_DEFAULT: ${SLACK_CHANNEL_DEFAULT:-#leads-inbound}
    SLACK_CHANNEL_OPS: ${SLACK_CHANNEL_OPS:-#automation-ops}
    ENRICHMENT_API_URL: ${ENRICHMENT_API_URL:-}
    HUBSPOT_TICKET_PIPELINE: ${HUBSPOT_TICKET_PIPELINE:-0}
    HUBSPOT_TICKET_STAGE: ${HUBSPOT_TICKET_STAGE:-1}
    HUBSPOT_DEAL_PIPELINE: ${HUBSPOT_DEAL_PIPELINE:-default}
    HUBSPOT_DEAL_STAGE: ${HUBSPOT_DEAL_STAGE:-appointmentscheduled}
    INVOICE_MAX_FILE_MB: ${INVOICE_MAX_FILE_MB:-10}
    INVOICE_MIN_CONFIDENCE: ${INVOICE_MIN_CONFIDENCE:-0.7}
    INVOICE_LLM_TIMEOUT_MS: ${INVOICE_LLM_TIMEOUT_MS:-90000}
    SLACK_CHANNEL_FINANCE: ${SLACK_CHANNEL_FINANCE:-#financeiro-revisao}
    GSHEETS_INVOICES_DOC_ID: ${GSHEETS_INVOICES_DOC_ID:-}
    GSHEETS_INVOICES_SHEET: ${GSHEETS_INVOICES_SHEET:-Invoices}
  volumes:
    - n8n_data:/home/node/.n8n
    - ./workflows:/opt/workflows:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      # Consumidas por infra/postgres/init/01-init-app-db.sh
      APP_DB_NAME: ${APP_DB_NAME:-automation}
      APP_DB_USER: ${APP_DB_USER:-automation_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction # BullMQ exige noeviction para não perder jobs
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    <<: *n8n-common
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  n8n-worker:
    <<: *n8n-common
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-5}
    depends_on:
      n8n:
        condition: service_healthy
    # Escale com: docker compose up -d --scale n8n-worker=3

volumes:
  postgres_data:
  redis_data:
  n8n_data:
